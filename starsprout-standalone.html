<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f0e8">
<title>星芽 StarSprout</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--cream:#faf7f2;--earth-50:#faf7f2;--earth-100:#f5f0e8;--earth-200:#ebe3d5;--earth-300:#d4c9b5;--earth-400:#b8a99a;--earth-500:#a0917b;--earth-600:#7d6f5d;--earth-700:#5e5345;--earth-800:#3d352c;--earth-900:#1f1b16;--gold:#c9a96e;--gold-light:#c9a96e30;--rose:#f4c2c2;--lavender:#d4c5e2;--mint:#b8d8ba;--sky:#b5d8e8;--peach:#fad4c0;--calm-blue:#7ba7c9;--calm-green:#8fbc8f;--calm-pink:#d4a5a5;--calm-purple:#b8a9c9}
html{scroll-behavior:smooth;font-size:16px}
body{font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;background:radial-gradient(ellipse at top,#fefce8 0%,#faf7f2 40%,#f5f0e8 100%);color:var(--earth-700);min-height:100dvh;-webkit-tap-highlight-color:transparent}
#root{min-height:100dvh}
.card{background:rgba(255,255,255,.82);backdrop-filter:blur(12px);border-radius:20px;box-shadow:0 2px 20px rgba(213,201,181,.4);border:1px solid rgba(235,227,213,.6);padding:20px;margin-bottom:14px;transition:all .3s}
.btn{padding:10px 24px;border-radius:999px;font-size:14px;font-weight:500;border:none;cursor:pointer;transition:all .2s;font-family:inherit}
.btn:active{transform:scale(.96)}
.btn-primary{background:rgba(201,169,110,.78);color:#fff;box-shadow:0 2px 12px rgba(201,169,110,.25)}
.btn-primary:hover{background:rgba(201,169,110,.9)}
.btn-ghost{background:transparent;color:var(--earth-400)}
.btn-ghost:hover{background:rgba(235,227,213,.4)}
.input{width:100%;background:rgba(255,255,255,.9);border:1px solid var(--earth-200);border-radius:16px;padding:10px 14px;font-size:14px;color:var(--earth-700);outline:none;font-family:inherit;transition:all .2s}
.input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,169,110,.15)}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.88);backdrop-filter:blur(20px);border-top:1px solid rgba(235,227,213,.7);display:flex;justify-content:space-around;align-items:center;height:64px;padding-bottom:env(safe-area-inset-bottom,4px);z-index:100}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 10px;border-radius:12px;cursor:pointer;font-size:20px;transition:all .2s;min-width:56px;border:none;background:none;font-family:inherit}
.nav-item span:last-child{font-size:10px;font-weight:500}
.nav-item.active{color:var(--gold);transform:scale(1.06)}
.nav-item:not(.active){color:var(--earth-400)}
.page{padding:24px 20px 100px;max-width:460px;margin:0 auto}
.fade-in{animation:fadeIn .35s ease-out}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes breathe{0%,100%{transform:scale(1);opacity:.7}50%{transform:scale(1.18);opacity:1}}
@keyframes twinkle{0%,100%{opacity:.3}50%{opacity:1}}
.float{animation:float 5s ease-in-out infinite}
.breathe{animation:breathe 8s ease-in-out infinite}
.twinkle{animation:twinkle 3s ease-in-out infinite}
.tag{font-size:10px;padding:2px 8px;border-radius:99px;font-weight:500}
.modal-overlay{position:fixed;inset:0;background:rgba(61,53,44,.25);backdrop-filter:blur(4px);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:#fff;border-radius:20px;padding:22px;max-width:400px;width:100%;box-shadow:0 8px 40px rgba(0,0,0,.12);max-height:85vh;overflow-y:auto}
h1{font-size:24px;font-weight:700;color:var(--earth-700);margin-bottom:4px}
h2{font-size:15px;font-weight:600;color:var(--earth-600);margin-bottom:8px}
.sub{font-size:13px;color:var(--earth-400)}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.grid-5{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.emoji-btn{aspect-ratio:1;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:24px;cursor:pointer;border:none;background:rgba(245,240,232,.5);transition:all .2s;font-family:inherit}
.emoji-btn:hover{background:rgba(245,240,232,.8)}
.emoji-btn.active{background:#fff;box-shadow:0 0 0 2px var(--gold-light);transform:scale(1.1)}
.emoji-btn span:last-child{font-size:9px;color:var(--earth-400)}
.intensity-btn{flex:1;padding:6px 0;border-radius:12px;font-size:11px;cursor:pointer;border:none;background:rgba(245,240,232,.5);color:var(--earth-400);transition:all .2s;font-family:inherit}
.intensity-btn.active{background:var(--gold-light);color:var(--gold);font-weight:600}
.code-editor{width:100%;background:#1f1b16;color:#a7f3a7;font-family:'Cascadia Code','Fira Code',monospace;font-size:13px;padding:12px;border-radius:14px;resize:vertical;min-height:100px;outline:none;border:none;line-height:1.5;tab-size:2}
.output-box{background:var(--earth-50);border:1px solid var(--earth-100);border-radius:14px;padding:12px;font-family:'Cascadia Code','Fira Code',monospace;font-size:13px;white-space:pre-wrap;color:var(--earth-600);margin-top:10px;min-height:40px}
.dots{display:flex;justify-content:center;gap:6px}
.dot{width:8px;height:8px;border-radius:99px;background:var(--earth-200);transition:all .3s}
.dot.active{width:24px;background:var(--gold)}
.progress-ring{transform:rotate(-90deg)}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--earth-300);border-radius:99px}
[data-theme="dark"]{--cream:#16162a;--earth-50:#16162a;--earth-100:#1e1e3a;--earth-200:#28284c;--earth-300:#3a3a62;--earth-400:#6a6a92;--earth-500:#9595b8;--earth-600:#bbb9d4;--earth-700:#d8d7ee;--earth-800:#ececf8;--earth-900:#f5f5ff;--gold:#dbb86e;--gold-light:#dbb86e28;--rose:#d4a0a0;--lavender:#b8a8d4;--mint:#8abc8c;--sky:#8ab8d8;--peach:#e0b898;--calm-blue:#6a96b8;--calm-green:#78a878;--calm-pink:#c09090;--calm-purple:#a898b8}
[data-theme="dark"] body{background:radial-gradient(ellipse at top,#1e1e42 0%,#16162a 40%,#12122a 100%)}
[data-theme="dark"] .card{background:rgba(30,30,50,.9);border-color:rgba(60,60,90,.5);box-shadow:0 2px 20px rgba(0,0,0,.3)}
[data-theme="dark"] .input{background:rgba(20,20,40,.7);border-color:var(--earth-300)}
[data-theme="dark"] .btn-ghost{color:var(--earth-400)}[data-theme="dark"] .btn-ghost:hover{background:rgba(60,60,90,.4)}
[data-theme="dark"] .bottom-nav{background:rgba(22,22,42,.92);border-color:rgba(60,60,90,.4)}
[data-theme="dark"] .emoji-btn{background:rgba(40,40,70,.5)}[data-theme="dark"] .emoji-btn.active{box-shadow:0 0 0 2px var(--gold-light)}
[data-theme="dark"] .intensity-btn{background:rgba(40,40,70,.5)}[data-theme="dark"] .modal{background:#1e1e3a;box-shadow:0 8px 40px rgba(0,0,0,.4)}
[data-theme="dark"] .modal-overlay{background:rgba(0,0,0,.5)}
[data-theme="dark"] .code-editor{background:#0a0a1e;color:#7aef8a}
[data-theme="dark"] .output-box{background:var(--earth-900)}
[data-theme="dark"] .dot{background:var(--earth-300)}
.theme-toggle{position:fixed;top:14px;right:14px;z-index:150;width:40px;height:40px;border-radius:99px;border:none;cursor:pointer;font-size:18px;background:rgba(255,255,255,.7);backdrop-filter:blur(8px);box-shadow:0 2px 12px rgba(0,0,0,.08);transition:all .3s;display:flex;align-items:center;justify-content:center}
[data-theme="dark"] .theme-toggle{background:rgba(40,40,70,.8);box-shadow:0 2px 12px rgba(0,0,0,.3)}
.top-nav-bar{display:flex;align-items:center;gap:6px;padding:4px 12px;max-width:460px;margin:0 auto;min-height:36px}
.top-nav-btn{display:inline-flex;align-items:center;gap:2px;padding:4px 10px;border-radius:99px;border:none;cursor:pointer;font-size:12px;font-family:inherit;color:var(--earth-500);background:rgba(235,227,213,.35);transition:.2s}
.top-nav-btn:hover{background:rgba(235,227,213,.55);color:var(--earth-600)}
.top-nav-btn:disabled{opacity:.28;cursor:default}
[data-theme="dark"] .top-nav-btn{background:rgba(40,40,70,.5);color:var(--earth-400)}
[data-theme="dark"] .top-nav-btn:hover{background:rgba(50,50,80,.6)}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useRef,useCallback,createContext,useContext,useMemo} = React;

// ── Store (localStorage-backed) ──
function loadStore(){
  try{const d=localStorage.getItem('starsprout');return d?JSON.parse(d):null}catch(e){return null}
}
function saveStore(s){
  try{localStorage.setItem('starsprout',JSON.stringify(s))}catch(e){}
}
const initialState={
  userName:'',userAvatar:'⭐',onboardingDone:false,
  moodHistory:[],todayChecked:'',streak:0,lastDate:'',
  mathProgress:[],gardenFlowers:[],
  codeProgress:[],
  likedInterests:[],puzzleDone:false,puzzleTrait:null,currentMood:null,theme:'light'
};
const StoreCtx=createContext(null);
function StoreProvider({children}){
  const [s,setS]=useState(()=>({...initialState,...loadStore()}));
  const update=useCallback((fn)=>{
    setS(prev=>{const n=typeof fn==='function'?fn(prev):{...prev,...fn};saveStore(n);return n});
  },[]);
  return <StoreCtx.Provider value={{s,update}}>{children}</StoreCtx.Provider>;
}
function useStore(){return useContext(StoreCtx)}

// ── Onboarding ──
const avatars=['⭐','🌙','🌸','🦋','🐣','🌈','🍀','🕊️','🐱','🦊'];
function Onboarding({onDone}){
  const {update}=useStore();
  const [step,setStep]=useState(0);
  const [name,setName]=useState('');const [avatar,setAvatar]=useState('⭐');
  const steps=[
    {t:'欢迎来到星芽 🌱',s:'这里没有考试，没有评判。\n只有一颗陪你发芽的星星。',i:'🌟',d:'你不必成为太阳，做一颗发芽的星星就好。'},
    {t:'今天感觉如何？',s:'我们可以从记录心情开始。\n不需要很多话，一个表情就够了。',i:'💛',d:'无论快乐或低落，所有情绪都值得被看见。'},
    {t:'慢慢来',s:'每天只需5分钟。\n学一点数学，写两行代码，或者只是呼吸。',i:'🐢',d:'不急不急，按你自己的节奏来。'}
  ];
  if(step===3){
    return <div className="page" style={{display:'flex',alignItems:'center',justifyContent:'center',minHeight:'100dvh'}}>
      <div className="card" style={{textAlign:'center',width:'100%'}}>
        <div style={{fontSize:56,marginBottom:12}}>{avatar}</div>
        <h2>怎么称呼你？</h2>
        <p className="sub" style={{marginBottom:12}}>可以是真名，也可以是任何你喜欢的名字</p>
        <div style={{display:'flex',flexWrap:'wrap',justifyContent:'center',gap:6,marginBottom:16}}>
          {avatars.map(a=><button key={a} onClick={()=>setAvatar(a)} style={{fontSize:24,padding:'4px 8px',borderRadius:12,border:'none',cursor:'pointer',background:a===avatar?'var(--gold-light)':'rgba(245,240,232,.5)',outline:a===avatar?'2px solid var(--gold-light)':'none',transform:a===avatar?'scale(1.15)':'scale(1)',transition:'all .2s'}}>{a}</button>)}
        </div>
        <input className="input" style={{textAlign:'center',marginBottom:14}} placeholder="你的名字..." value={name} onChange={e=>setName(e.target.value)} onKeyDown={e=>e.key==='Enter'&&onDone({name:name||'小星星',avatar})} autoFocus/>
        <button className="btn btn-primary" style={{width:'100%'}} onClick={()=>onDone({name:name||'小星星',avatar})}>开始旅程 🌱</button>
        <p style={{fontSize:10,color:'var(--earth-400)',marginTop:10,lineHeight:1.5}}>星芽不替代专业心理治疗。如需帮助，可拨打 24h 心理援助热线 <b>400-161-9995</b></p>
      </div>
    </div>;
  }
  const s=steps[step];
  return <div className="page" style={{display:'flex',alignItems:'center',justifyContent:'center',minHeight:'100dvh'}}>
    <div className="card" style={{textAlign:'center',width:'100%'}}>
      <div className="float" style={{fontSize:64,marginBottom:16}}>{s.i}</div>
      <h1>{s.t}</h1>
      <p style={{whiteSpace:'pre-line',color:'var(--earth-500)',marginBottom:8,lineHeight:1.6}}>{s.s}</p>
      <p style={{fontSize:12,color:'var(--earth-400)',fontStyle:'italic',marginBottom:16}}>{s.d}</p>
      <div className="dots" style={{marginBottom:16}}>{steps.map((_,i)=><div key={i} className={`dot ${i===step?'active':''}`}/>)}</div>
      <button className="btn btn-primary" style={{width:'100%'}} onClick={()=>setStep(step+1)}>{step<2?'继续 →':'准备好了 ✨'}</button>
      {step>0&&<button className="btn btn-ghost" style={{width:'100%',marginTop:8}} onClick={()=>setStep(step-1)}>← 上一步</button>}
    </div>
  </div>;
}

// ── Bottom Nav ──
const tabs=[
  {id:'mood',label:'晨露',icon:'🌤️',activeIcon:'☀️'},
  {id:'math',label:'数语',icon:'🌱',activeIcon:'🌻'},
  {id:'code',label:'萤火',icon:'✨',activeIcon:'💫'},
  {id:'path',label:'星图',icon:'🧭',activeIcon:'⭐'},
  {id:'safe',label:'树洞',icon:'🌳',activeIcon:'🏡'}
];
function BottomNav({active,onChange}){
  return <nav className="bottom-nav">{tabs.map(t=><button key={t.id} className={`nav-item ${active===t.id?'active':''}`} onClick={()=>onChange(t.id)}><span>{active===t.id?t.activeIcon:t.icon}</span><span>{t.label}</span></button>)}</nav>;
}

// ── Breath Flower ──
function BreathFlower({onDone}){
  const phases=['吸气','屏息','呼气','放松'];
  const durations=[4,7,8,2];
  const scales=[1.35,1.35,0.8,1];
  const [phase,setPhase]=useState(0);
  const [count,setCount]=useState(durations[0]);
  const [active,setActive]=useState(false);
  const [cycles,setCycles]=useState(0);
  const timer=useRef(null);
  useEffect(()=>{
    if(!active)return;
    timer.current=setInterval(()=>{
      setCount(c=>{
        if(c<=1){
          const next=(phase+1)%4;
          setPhase(next);
          if(next===0)setCycles(cy=>cy+1);
          return durations[next];
        }
        return c-1;
      });
    },1000);
    return ()=>clearInterval(timer.current);
  },[active,phase]);
  useEffect(()=>{
    if(cycles>=3){setActive(false);setPhase(0);setCount(durations[0]);setCycles(0);onDone&&onDone()}
  },[cycles]);
  const start=()=>{setActive(true);setPhase(0);setCount(durations[0]);setCycles(0)};
  const colors=['#facc15','#f4c542','#e8a850','#c9a96e','#d4a574','#e0b880'];
  return <div style={{display:'flex',flexDirection:'column',alignItems:'center'}}>
    <div style={{position:'relative',width:120,height:120,marginBottom:20,transform:`scale(${active?scales[phase]:1})`,transition:active?`transform ${durations[phase]}s ease-in-out`:'transform .5s ease'}}>
      {[0,60,120,180,240,300].map((angle,i)=><div key={angle} style={{position:'absolute',top:'50%',left:'50%',width:56,height:24,marginTop:-12,marginLeft:-56,transform:`rotate(${angle}deg)`,transformOrigin:'right center'}}><div style={{width:'100%',height:'100%',borderRadius:99,background:colors[i],opacity:.8,transform:`scaleY(${active&&phase===2?0.6:1})`,transition:'.6s ease'}}/></div>)}
      <div className="twinkle" style={{position:'absolute',top:'50%',left:'50%',width:36,height:36,marginTop:-18,marginLeft:-18,borderRadius:99,background:'rgba(201,169,110,.3)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:18}}>🌼</div>
    </div>
    {active?<div style={{textAlign:'center'}}><p style={{fontSize:22,fontWeight:700,color:'var(--gold)',marginBottom:2}}>{phases[phase]}</p><p style={{fontSize:38,fontWeight:300,color:'var(--earth-400)',marginBottom:4}}>{count}</p><p className="sub">第 {Math.min(cycles+1,3)} / 3 轮</p></div>:
    <div style={{textAlign:'center'}}><p className="sub" style={{marginBottom:12}}>跟着花朵一起呼吸，让焦虑慢慢消散</p><button className="btn btn-primary" onClick={start}>开始呼吸练习 🌸</button></div>}
  </div>;
}

// ── Mood Page ──
const moods=[['😊','开心'],['😌','平静'],['😐','还行'],['😔','低落'],['😢','难过'],['😤','烦躁'],['🥺','委屈'],['😴','疲惫'],['🌈','有希望'],['💪','有力量']];
const intensityLabels=['很轻微','有一点','中等','比较强','非常强'];
const warmRepliesByMood={
  '😢':['嗯，今天有点难。呼吸花园要不要去坐一会儿？','我听到了。这种感觉是真实的，也是暂时的。','想哭就哭吧，眼泪是身体在自我照顾。'],
  '😔':['今天有点灰，不过没关系。陪你坐坐。','不想动的话，就先不动。我在这儿。','你已经很努力了，即使什么都不做也算。'],
  '🥺':['那种委屈的感觉，胸口像堵着一团东西。慢慢说。','被误解很难受。你不是无理取闹。','你不需要解释自己。'],
  '😤':['嗯，那股烦躁像一团火。呼吸花园也许能帮它凉下来一点。','先不急着做任何事，深呼吸三次。','有时候只是需要一个出口。我听着。'],
  '😴':['累了就歇。不需要今天解决所有问题。','你的身体在告诉你需要休息——听它的。','休息也是一种进步。'],
  '😐':['一般般的一天。有什么想说的，我在。','有时候"没什么感觉"也是一种感觉。','不急着找方向，先坐一会儿。'],
  '😌':['这种平静很好。谢谢你把它记录下来。','安安静静的，像湖面一样。'],
  '😊':['今天有点暖。要不要试一颗小种子？','这份开心值得被记住。'],
  '🌈':['这片阳光我们记下了 ✨','希望这种感觉能陪你久一点。'],
  '💪':['嗯，今天有力量。想做点什么吗？','有能量的日子，哪怕只走一小步也很好。'],
};
function getWarmReply(mood){
  const pool=warmRepliesByMood[mood]||warmRepliesByMood['😐'];
  return pool[Math.floor(Math.random()*pool.length)];
}
const lowMoods=['😢','😔','🥺','😤','😴'];
function isLowMood(m){return lowMoods.includes(m)};

function MoodPage(){
  const {s,update}=useStore();
  const [mood,setMood]=useState(null);
  const [intensity,setIntensity]=useState(3);
  const [note,setNote]=useState('');
  const [showBreath,setShowBreath]=useState(false);
  const [reply,setReply]=useState('');
  const today=new Date().toDateString();
  const checked=s.todayChecked===today;
  const greeting=()=>{const h=new Date().getHours();if(h<6)return'夜深了 🌙';if(h<12)return'早上好 ☀️';if(h<14)return'中午好 🌤️';if(h<18)return'下午好 🌈';return'晚上好 🌆'};
  const recent=s.moodHistory.slice(0,7);
  const checkin=()=>{
    if(!mood)return;
    update(prev=>{
      const newHist=[{emoji:mood,intensity,note,ts:Date.now()},...prev.moodHistory].slice(0,365);
      const yest=new Date(Date.now()-864e5).toDateString();
      const newStreak=prev.lastDate===yest?prev.streak+1:1;
      return {...prev,moodHistory:newHist,todayChecked:today,streak:newStreak,lastDate:today,currentMood:mood};
    });
    setReply(getWarmReply(mood));
  };
  return <div className="page fade-in" key="mood">
    <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:20}}>
      <div><p style={{fontSize:15,color:'var(--earth-500)'}}>{greeting()}</p><h1 style={{display:'flex',alignItems:'center',gap:8,marginBottom:0}}><span>{s.userAvatar}</span>{s.userName||'小星星'}</h1></div>
      {s.streak>0&&<div style={{display:'flex',alignItems:'center',gap:4,background:'#fefce8',padding:'4px 10px',borderRadius:99,fontSize:13,fontWeight:600,color:'#eab308'}}>🔥 {s.streak} 天</div>}
    </div>
    {!checked?<div className="card">

const stageInfo={seed:{l:'种子',i:'🌰'},sprout:{l:'发芽',i:'🌱'},bud:{l:'花苞',i:'🌷'},flower:{l:'开花',i:'🌸'}};

function MathPage(){
  const {s,update}=useStore();
  const [active,setActive]=useState(null);
  const [answer,setAnswer]=useState(null);
  const [hint,setHint]=useState(false);
  const [result,setResult]=useState(null);
  const getProg=id=>s.mathProgress.find(p=>p.conceptId===id);
  const handleAns=(idx)=>{
    setAnswer(idx);
    const q=quizzes[active];
    if(idx===q.c){
      setResult('correct');
      setTimeout(()=>{
        const prog=getProg(active);
        const st=prog?.stage||'seed';
        const next=st==='seed'?'sprout':st==='sprout'?'bud':'flower';
        update(prev=>{
          const exist=prev.mathProgress.findIndex(p=>p.conceptId===active);
          let newProg=[...prev.mathProgress];
          const entry={conceptId:active,stage:next,attempts:(prog?.attempts||0)+1,completedAt:next==='flower'?Date.now():undefined};
          if(exist>=0)newProg[exist]=entry;else newProg.push(entry);
          const newFlowers=next==='flower'?[...prev.gardenFlowers,['🌷','🌻','🌺','🦋','🐝','💐'][Math.floor(Math.random()*6)]]:prev.gardenFlowers;
          return {...prev,mathProgress:newProg,gardenFlowers:newFlowers};
        });
        setResult(null);setAnswer(null);setActive(null);setHint(false);
      },1500);
    }else{
      setResult('incorrect');
      setTimeout(()=>{setResult(null);setAnswer(null);setHint(true)},1200);
    }
  };

      <div style={{background:'linear-gradient(180deg,#7ba7c918,#8fbc8f18)',borderRadius:16,padding:16,minHeight:60,display:'flex',alignItems:'center',justifyContent:'center',flexWrap:'wrap',gap:2}}>
        {s.gardenFlowers.length===0?<span className="sub">一片等待播种的土壤...</span>:s.gardenFlowers.map((d,i)=><span key={i} className="float" style={{fontSize:22,animationDelay:i*0.2+'s'}}>{d}</span>)}
      </div>
    </div>
    <h2>今天的种子</h2>
    <div className="grid-2">{concepts.map(c=>{const p=getProg(c.id);const st=stageInfo[p?.stage||'seed'];return <div key={c.id} className="card" style={{padding:14,cursor:'pointer'}} onClick={()=>{setActive(c.id);setAnswer(null);setHint(false);setResult(null)}}>
      <div style={{display:'flex',alignItems:'center',gap:6,marginBottom:4}}><span style={{fontSize:22}}>{c.icon}</span><span style={{fontSize:10,color:'var(--earth-400)',fontStyle:'italic'}}>{c.cat==='linear'?'线代':'微积分'}</span></div>
      <h3 style={{fontSize:13,marginBottom:2}}>{c.t}</h3><div style={{display:'flex',alignItems:'center',gap:4}}><span>{st.i}</span><span style={{fontSize:11,color:'var(--earth-400)'}}>{st.l}</span></div>
    </div>})}</div>
    {active&&<div className="modal-overlay" onClick={()=>{if(!result){setActive(null);setHint(false)}}}><div className="modal" onClick={e=>e.stopPropagation()}>
      {result?<div style={{textAlign:'center',padding:'20px 0'}}><div style={{fontSize:48,marginBottom:8}}>{result==='correct'?'🌸':'💛'}</div><p style={{fontSize:18,fontWeight:600}}>{result==='correct'?'这颗种子今天开了一瓣 🌱':'这次没开，但我们看到了变化——这就是探索的一部分'}</p></div>:
      <div>

          <div style={{display:'flex',alignItems:'center',gap:6,marginBottom:4}}><span style={{fontSize:24}}>{concepts.find(x=>x.id===active)?.icon}</span><h3 style={{marginBottom:0}}>{concepts.find(x=>x.id===active)?.t}</h3></div>
          <p style={{fontSize:13,color:'var(--earth-500)'}}>{concepts.find(x=>x.id===active)?.d}</p>
        </div>
        <p style={{fontSize:14,fontWeight:500,marginBottom:10}}>{quizzes[active]?.q}</p>

      </div></div>
      <div className="grid-2">{sparks.map(s=><div key={s.id} className="card" style={{padding:14,cursor:'pointer'}} onClick={()=>open(s)}>
        <div style={{display:'flex',alignItems:'center',gap:6,marginBottom:6}}><span style={{fontSize:22}}>{s.icon}</span><span className="tag" style={{background:s.s===1?'#8fbc8f20':s.s===2?'#7ba7c920':'#b8a9c920',color:s.s===1?'var(--calm-green)':s.s===2?'var(--calm-blue)':'var(--calm-purple)'}}>{s.tag}</span></div>
        <h3 style={{fontSize:13,marginBottom:2}}>{s.t}</h3><p style={{fontSize:11,color:'var(--earth-400)',lineHeight:1.5,overflow:'hidden',display:'-webkit-box',WebkitLineClamp:2,WebkitBoxOrient:'vertical'}}>{s.d}</p>
      </div>)}</div>
      {active&&<div className="modal-overlay" onClick={()=>setActive(null)}><div className="modal" onClick={e=>e.stopPropagation()}>
        <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:10}}><span style={{fontSize:24}}>{active.icon}</span><div><h3 style={{marginBottom:0}}>{active.t}</h3><p className="sub">{active.d}</p></div></div>
        <textarea className="code-editor" style={{resize:'vertical',minHeight:Math.min(code.split('\n').length*22+24,240)}} value={code} onChange={e=>setCode(e.target.value)} spellCheck={false}/>
        <div style={{display:'flex',gap:8,margin:'10px 0'}}><button className="btn btn-primary" style={{flex:1}} onClick={run}>运行 ▶️</button><button className="btn btn-ghost" style={{flex:1}} onClick={reset}>重置 🔄</button></div>
        {out&&<div className="output-box">{out}</div>}
        <p style={{fontSize:10,color:'var(--earth-300)',textAlign:'center',marginTop:8}}>每条路都值得走一走——每次运行都是一次探索 🌟</p>
      </div></div>}
    </div>}
    <p className="sub" style={{textAlign:'center',marginTop:20}}>走到哪儿了都算走了。下次从这里继续就好 ✨</p>
  </div>;
}

function AiCompanion(){

  const [loading,setLoading]=useState(false);
  const [open,setOpen]=useState(false);
  const listRef=useRef(null);
  useEffect(()=>{if(listRef.current){listRef.current.scrollTop=listRef.current.scrollHeight}},[msgs]);
  const send=()=>{
    const txt=inp.trim();if(!txt||loading)return;
    const userMsg={role:'user',content:txt};
    const newMsgs=[...msgs,userMsg];setMsgs(newMsgs);setInp('');setLoading(true);
    const moodCtx=s.currentMood?('[用户当前心情: '+s.currentMood+'] '):'';
    const hist=newMsgs.slice(-10).map(function(m){return {role:m.role,content:m.role==='user'?moodCtx+m.content:m.content}});
    fetch('https://api.deepseek.com/v1/chat/completions',{
      method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+AI_KEY},
      body:JSON.stringify({model:'deepseek-chat',messages:[{role:'system',content:AI_SYSTEM}].concat(hist),max_tokens:400,temperature:0.85})
    }).then(function(res){return res.json()}).then(function(d){
      var reply=(d&&d.choices&&d.choices[0]&&d.choices[0].message&&d.choices[0].message.content)||'（星星闪烁了一下…再试一次好吗？✨）';
      setMsgs(function(p){return p.concat([{role:'assistant',content:reply}])});
    }).catch(function(e){setMsgs(function(p){return p.concat([{role:'assistant',content:'网络不太好，但星星还在。再试一次？✨'}])})}).finally(function(){setLoading(false)});
  };
  const handleKey=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}};
  if(!open)return <div className="card" style={{textAlign:'center',cursor:'pointer'}} onClick={()=>setOpen(true)}>

    <p style={{fontSize:11,color:'var(--gold)',marginTop:6}}>点击打开</p>
  </div>;

// ── Ambient Audio Engine ──
let _ac=null,_nodes=null;
function _acx(){if(!_ac){_ac=new(window.AudioContext||window.webkitAudioContext)();_ac.resume()}return _ac}
function _nb(d=3){const a=_acx(),l=a.sampleRate*d,b=a.createBuffer(1,l,a.sampleRate),c=b.getChannelData(0);for(let i=0;i<l;i++)c[i]=Math.random()*2-1;return b}
function _stopAud(){if(_nodes){try{const a=_acx(),t=a.currentTime;_nodes.gn.gain.linearRampToValueAtTime(0,t+.05);_nodes.src&&_nodes.src.stop(t+.1)}catch(e){}setTimeout(()=>{try{if(_nodes){_nodes.gn.disconnect();_nodes.lp&&_nodes.lp.disconnect();_nodes.hp&&_nodes.hp.disconnect();_nodes.lfo&&_nodes.lfo.stop()}}catch(e){}_nodes=null},200)}}
function _playAud(id){
  _stopAud();if(!id)return;
  const a=_acx(),gn=a.createGain();gn.gain.value=0;gn.connect(a.destination);
  const src=a.createBufferSource();src.buffer=_nb(4);src.loop=true;src.start();
  let nodes={gn,src};
  if(id==='rain'){
    const lp=a.createBiquadFilter();lp.type='lowpass';lp.frequency.value=500;lp.Q.value=0.6;
    const lfoG=a.createGain();lfoG.gain.value=0.08;const lfo=a.createOscillator();lfo.frequency.value=.3;
    lfo.connect(lfoG);lfoG.connect(lp.frequency);lfo.start();
    src.connect(lp);lp.connect(gn);gn.gain.linearRampToValueAtTime(.35,a.currentTime+.3);
    nodes={gn,src,lp,lfo};
  }else if(id==='ocean'){
    const lp=a.createBiquadFilter();lp.type='lowpass';lp.frequency.value=350;lp.Q.value=0.4;
    const lfoG=a.createGain();lfoG.gain.value=0.25;const lfo=a.createOscillator();lfo.frequency.value=.12;
    lfo.connect(lfoG);lfoG.connect(gn.gain);lfo.start();
    src.connect(lp);lp.connect(gn);gn.gain.linearRampToValueAtTime(.4,a.currentTime+.5);
    nodes={gn,src,lp,lfo};
  }else if(id==='fire'){
    const bp=a.createBiquadFilter();bp.type='bandpass';bp.frequency.value=800;bp.Q.value=0.3;
    const lfoG=a.createGain();lfoG.gain.value=0.6;const lfo=a.createOscillator();lfo.frequency.value=3;
    lfo.connect(lfoG);lfoG.connect(gn.gain);lfo.start();
    src.connect(bp);bp.connect(gn);gn.gain.linearRampToValueAtTime(.25,a.currentTime+.2);
    nodes={gn,src,lp:bp,lfo};
  }else if(id==='forest'){
    const bp=a.createBiquadFilter();bp.type='bandpass';bp.frequency.value=1200;bp.Q.value=0.2;
    const lfoG=a.createGain();lfoG.gain.value=0.7;const lfo=a.createOscillator();lfo.frequency.value=8;
    lfo.connect(lfoG);lfoG.connect(gn.gain);lfo.start();
    const lp2=a.createBiquadFilter();lp2.type='lowpass';lp2.frequency.value=200;lp2.Q.value=.5;
    const s2=a.createBufferSource();s2.buffer=_nb(4);s2.loop=true;s2.start();
    s2.connect(lp2);lp2.connect(gn);
    src.connect(bp);bp.connect(gn);gn.gain.linearRampToValueAtTime(.18,a.currentTime+.4);
    nodes={gn,src,lp:bp,lfo,src2:s2,lp2};
  }else if(id==='cafe'){
    const lp=a.createBiquadFilter();lp.type='lowpass';lp.frequency.value=300;lp.Q.value=0.2;
    const lfoG=a.createGain();lfoG.gain.value=0.15;const lfo=a.createOscillator();lfo.frequency.value=1.5;
    lfo.connect(lfoG);lfoG.connect(gn.gain);lfo.start();
    src.connect(lp);lp.connect(gn);gn.gain.linearRampToValueAtTime(.2,a.currentTime+.3);
    nodes={gn,src,lp,lfo};
  }else if(id==='wind'){
    const bp=a.createBiquadFilter();bp.type='bandpass';bp.frequency.value=500;bp.Q.value=0.15;
    const lfoG1=a.createGain();lfoG1.gain.value=300;const lfo1=a.createOscillator();lfo1.frequency.value=.08;
    lfo1.connect(lfoG1);lfoG1.connect(bp.frequency);lfo1.start();
    const lfoG2=a.createGain();lfoG2.gain.value=.15;const lfo2=a.createOscillator();lfo2.frequency.value=.2;
    lfo2.connect(lfoG2);lfoG2.connect(gn.gain);lfo2.start();
    src.connect(bp);bp.connect(gn);gn.gain.linearRampToValueAtTime(.3,a.currentTime+.4);
    nodes={gn,src,lp:bp,lfo1,lfo2};
  }
  _nodes=nodes;
}

// ── App ──
function App(){
  const {s,update}=useStore();
  const [tab,setTab]=useState('mood');
  const [histPos,setHistPos]=useState(0);
  const histRef=useRef(['mood']);
  const posRef=useRef(0);
  const tabRef=useRef('mood');
  useEffect(()=>{document.documentElement.setAttribute('data-theme',s.theme||'light')},[s.theme]);
  const toggleTheme=()=>update(prev=>({...prev,theme:prev.theme==='dark'?'light':'dark'}));
  // 初始同步 hash
  useEffect(()=>{
    const h=(window.location.hash||'').replace('#','');
    if(h&&tabs.some(t=>t.id===h)&&h!=='mood'){
      setTab(h);tabRef.current=h;
      histRef.current=[h];posRef.current=0;setHistPos(0);
    }
  },[]);
  // 监听手机/浏览器返回键
  useEffect(()=>{
    const onPop=()=>{
      const h=(window.location.hash||'').replace('#','');
      if(h&&tabs.some(t=>t.id===h)&&h!==tabRef.current){
        tabRef.current=h;setTab(h);
        const idx=histRef.current.lastIndexOf(h);
        if(idx>=0){posRef.current=idx;setHistPos(idx);}
        else{histRef.current.push(h);posRef.current=histRef.current.length-1;setHistPos(histRef.current.length-1);}
      }
    };
    window.addEventListener('popstate',onPop);
    return ()=>window.removeEventListener('popstate',onPop);
  },[]);
  const goTab=(t,push)=>{
    if(t===tabRef.current)return;
    tabRef.current=t;setTab(t);
    if(push){
      histRef.current=histRef.current.slice(0,posRef.current+1);
      histRef.current.push(t);posRef.current=histRef.current.length-1;
      setHistPos(posRef.current);
      history.pushState(null,'','#'+t);
    }
  };
  const goBack=()=>{if(posRef.current>0){posRef.current--;setHistPos(posRef.current);const nt=histRef.current[posRef.current];tabRef.current=nt;setTab(nt);history.replaceState(null,'','#'+nt)}};
  const goFwd=()=>{if(posRef.current<histRef.current.length-1){posRef.current++;setHistPos(posRef.current);const nt=histRef.current[posRef.current];tabRef.current=nt;setTab(nt);history.replaceState(null,'','#'+nt)}};
  if(!s.onboardingDone)return <Onboarding onDone={({name,avatar})=>update({userName:name,userAvatar:avatar,onboardingDone:true})}/>;
  return <div>
    <button className="theme-toggle" onClick={toggleTheme} title={s.theme==='dark'?'切换亮色':'切换暗色'}>{s.theme==='dark'?'☀️':'🌙'}</button>
    <div className="top-nav-bar">
      <button className="top-nav-btn" onClick={goBack} disabled={histPos===0}>← 后退</button>
      <button className="top-nav-btn" onClick={goFwd} disabled={histPos>=histRef.current.length-1} style={{marginRight:'auto'}}>前进 →</button>
      <span style={{fontSize:11,color:'var(--earth-400)'}}>{tabs.find(t=>t.id===tab)?.label||''}</span>
    </div>
    {tab==='mood'&&<MoodPage/>}
    {tab==='math'&&<MathPage/>}
    {tab==='code'&&<CodePage/>}
    {tab==='path'&&<PathPage/>}
    {tab==='safe'&&<SafePage/>}
    <BottomNav active={tab} onChange={t=>goTab(t,true)}/>
  </div>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<StoreProvider><App/></StoreProvider>);
</script>
